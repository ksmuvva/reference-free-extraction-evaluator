[project]
name = "reference-free-extraction-evaluator"
version = "0.3.0"
description = "Reference-free validation of structured extraction output against source interview JSON."
requires-python = ">=3.11"
dependencies = [
  "dspy==3.3.1",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
