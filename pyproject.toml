[project]
name = "reference-free-extraction-evaluator"
version = "0.2.0"
description = "Evaluation-only agent for validating structured extraction output against source Q&A JSON."
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.2.0",
  "dspy>=3.0.0",
  "pydantic>=2.8"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
